<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Swap 3D</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  #game { width:100%; height:100vh; display:block; }
  #score { position:absolute; top:10px; left:10px; color:#fff; font-family:sans-serif; font-size:24px; z-index:10;}
</style>
</head>
<body>
<div id="game"></div>
<div id="score">Score: 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let player, obstacles = [], shadowWorld = true;
let score = 0, speed = 0.1;

const container = document.getElementById('game');
const scoreDisplay = document.getElementById('score');

// Scene & Camera
scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(60, container.clientWidth/container.clientHeight, 0.1, 100);
camera.position.set(0,5,10);
camera.lookAt(0,0,0);

// Renderer
renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
dirLight.position.set(5,10,7);
scene.add(dirLight);

// Player
const geo = new THREE.BoxGeometry(1,1,1);
const mat = new THREE.MeshPhongMaterial({color:0x00ff00});
player = new THREE.Mesh(geo, mat);
player.position.set(0,0.5,0);
scene.add(player);

// Ground
const groundGeo = new THREE.PlaneGeometry(50,50);
const groundMat = new THREE.MeshPhongMaterial({color:0x222222});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Obstacles
function createObstacle(){
    const size = Math.random()*1+0.5;
    const geo = new THREE.BoxGeometry(size,size,size);
    const mat = new THREE.MeshPhongMaterial({color:0xff0000});
    const obs = new THREE.Mesh(geo, mat);
    obs.position.set((Math.random()-0.5)*8, size/2, -20);
    obs.userData = {passed:false};
    scene.add(obs);
    obstacles.push(obs);
}

// World Swap
window.addEventListener('click', ()=>{ shadowWorld = !shadowWorld; });

// Animate
function animate(){
    requestAnimationFrame(animate);

    // Move obstacles
    obstacles.forEach((obs, i)=>{
        obs.position.z += speed;
        if(obs.position.z > 10){
            scene.remove(obs);
            obstacles.splice(i,1);
        }
        // Collision check
        if(!obs.userData.passed && Math.abs(obs.position.z - player.position.z)<1 && Math.abs(obs.position.x - player.position.x)<1){
            if(shadowWorld){ // collision only in shadow world
                alert("Game Over! Score: "+score);
                window.location.reload();
            }
        }
        // Score
        if(!obs.userData.passed && obs.position.z > player.position.z){
            score +=1;
            obs.userData.passed = true;
            scoreDisplay.innerText = "Score: "+score;
            if(score % 10 ===0) speed +=0.02; // increase difficulty
        }
    });

    // Random obstacle generate
    if(Math.random()<0.02) createObstacle();

    // Update obstacle visibility based on world
    obstacles.forEach(obs=>{
        obs.visible = shadowWorld;
    });

    // Player color indicates world
    player.material.color.set(shadowWorld ? 0x00ff00 : 0x00ffff);

    renderer.render(scene,camera);
}

animate();

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = container.clientWidth/container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
